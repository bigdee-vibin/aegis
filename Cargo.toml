[workspace]
resolver = "2"
members = [
    "crates/aegis-core",
    "crates/aegis-policy",
    "crates/aegis-egress",
    "crates/aegis-testkit",
    "crates/aegis-daemon",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aegis-core = { path = "crates/aegis-core" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
