[workspace]
resolver = "2"
members = [
    "crates/aegis-core",
    "crates/aegis-policy",
    "crates/aegis-detect-secrets",
    "crates/aegis-inspect",
    "crates/aegis-audit",
    "crates/aegis-gateway",
    "crates/aegis-egress",
    "crates/aegis-testkit",
    "crates/aegis-daemon",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.90"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
base64 = "0.22"
unicode-normalization = "0.1"
sha2 = "0.10"
subtle = "2"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "io-util"] }
tower = { version = "0.5", features = ["util"] }
aegis-core = { path = "crates/aegis-core" }
aegis-policy = { path = "crates/aegis-policy" }
aegis-detect-secrets = { path = "crates/aegis-detect-secrets" }
aegis-inspect = { path = "crates/aegis-inspect" }
aegis-audit = { path = "crates/aegis-audit" }
aegis-gateway = { path = "crates/aegis-gateway" }
aegis-testkit = { path = "crates/aegis-testkit" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
